# environment_md.yml — 药尘光 完整本地环境
# 安装: conda env create -f environment_md.yml
# 激活: conda activate egfr-md
# 启动: streamlit run app.py
# 参考: TeachOpenCADD T019 (https://github.com/volkamerlab/TeachOpenCADD)

name: egfr-md
channels:
  - conda-forge
  - defaults

dependencies:
  - python=3.10
  - pip
  # ========== MD 核心引擎 ==========
  - openmm=8.1.1
  - pdbfixer=1.9
  - openmmforcefields=0.12.0
  - mdtraj=1.9.9
  - openff-toolkit=0.15.2
  # ========== 分子对接 ==========
  - openbabel
  - smina
  # ========== 蛋白-配体相互作用 ==========
  - plip
  # ========== 化学信息学 ==========
  - rdkit>=2022.09
  # ========== 数据处理 ==========
  - numpy>=1.24
  - pandas>=1.5
  - matplotlib>=3.7
  - seaborn>=0.12
  # ========== Web 框架 ==========
  - streamlit>=1.28
  # ========== 传统 ML ==========
  - scikit-learn>=1.3
  - joblib>=1.3
  # ========== 网络请求 ==========
  - requests>=2.31
  # ========== 图像处理 ==========
  - pillow>=10.0
  # ========== Jupyter 交互 ==========
  - ipywidgets>=8.0
  # ========== pip 依赖 ==========
  - pip:
    - py3Dmol==2.0.4
    - ipython_genutils==0.2.0
    - umap-learn==0.5.5
    - chembl_webresource_client>=0.10.9
    - nglview>=3.1.0
    - shap>=0.41.0
    - plotly>=5.18.0
    # PyTorch (CPU only — GPU 加速需手动安装 CUDA 版本)
    - torch==2.1.2+cpu --extra-index-url https://download.pytorch.org/whl/cpu
    - torch-geometric==2.4.0
