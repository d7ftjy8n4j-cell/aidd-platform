# environment_md.yml — 分子动力学模拟专用环境
# 安装: conda env create -f environment_md.yml
# 激活: conda activate egfr-md
# 参考: TeachOpenCADD T019 (https://github.com/volkamerlab/TeachOpenCADD)

name: egfr-md
channels:
  - conda-forge
  - defaults

dependencies:
  - python=3.10
  - pip
  # MD 核心引擎（锁定兼容版本，参考 TeachOpenCADD T019）
  - openmm=8.1.1
  - pdbfixer=1.9
  - openmmforcefields=0.12.0
  - mdtraj=1.9.9
  - openff-toolkit=0.15.2
  # 化学信息学
  - rdkit>=2022.09
  # 数据处理
  - numpy>=1.24
  - pandas>=1.5
  - matplotlib>=3.7
  # Web 框架
  - streamlit>=1.28
  # 现有项目依赖
  - scikit-learn>=1.3
  - joblib>=1.3
  - requests>=2.31
  - seaborn>=0.12
  - pip:
    - py3Dmol==2.0.4
    - ipython_genutils==0.2.0
    - umap-learn==0.5.5
    - chembl_webresource_client>=0.10.9
    - nglview>=3.1.0
    # PyTorch (CPU only — GPU 加速需手动安装 CUDA 版本)
    - torch==2.1.2+cpu --extra-index-url https://download.pytorch.org/whl/cpu
    - torch-geometric==2.4.0
