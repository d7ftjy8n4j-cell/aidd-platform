name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      KMP_DUPLICATE_LIB_OK: "TRUE"
      OMP_DUPLICATE_LIB_OK: "TRUE"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            dev-requirements.txt

      - name: Install dependencies
        run: python -m pip install -r requirements.txt -r dev-requirements.txt

      - name: Run tests
        run: python -m pytest -q

      - name: Compile Python sources
        run: |
          python - <<'PY'
          import compileall
          import sys

          if not compileall.compile_dir('.', quiet=1, rx=r'(^|[/\\])(data|artifacts|\.git)([/\\]|$)'):
              sys.exit(1)
          PY

      - name: Streamlit health check
        shell: bash
        run: |
          python -m streamlit run app.py \
            --server.port 8501 \
            --server.address 127.0.0.1 \
            --server.headless true > streamlit.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT

          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8501/_stcore/health; then
              exit 0
            fi
            sleep 2
          done

          cat streamlit.log
          exit 1
